<div class="todo-container">
  <h1>📋 Список задач</h1>

  <div class="form-row">
    <input [(ngModel)]="newTitle" placeholder="Новая задача" />
    <input type="date" [(ngModel)]="newDueDate" />
    <button (click)="addTodo()">Добавить</button>
  </div>

  <div class="filter-row">
    <label for="filter">Фильтр:</label>
    <select id="filter" [(ngModel)]="selectedStatus">
      <option value="all">Все</option>
      <option [ngValue]="TodoStatus.Active">Активные</option>
      <option [ngValue]="TodoStatus.Completed">Выполненные</option>
      <option [ngValue]="TodoStatus.Archived">Архив</option>
    </select>
  </div>

  @defer {
  <ul>
    @for (todo of (todos$ | async); track todo.id) { @if(todo.status === selectedStatus) {
    <li
      [ngClass]="{
            'completed': todo.status === TodoStatus.Completed,
            'archived': todo.status === TodoStatus.Archived
          }"
    >
      <div class="task-header">
        <input [(ngModel)]="todo.title" (blur)="editTitle(todo.id, todo.title)" />
        <button class="delete" (click)="deleteTodo(todo.id)">
          <span class="material-icons">Удалить</span>
        </button>
      </div>

      <div class="task-meta">
        <label [attr.for]="'status-' + todo.id">Статус:</label>
        <select
          [id]="'status-' + todo.id"
          [(ngModel)]="todo.status"
          (change)="updateStatus(todo.id, todo.status)"
        >
          <option [ngValue]="TodoStatus.Active">Активна</option>
          <option [ngValue]="TodoStatus.Completed">Выполнена</option>
          <option [ngValue]="TodoStatus.Archived">Архив</option>
        </select>
      </div>

      <div class="task-meta">
        <label [attr.for]="'due-' + todo.id">Дедлайн:</label>
        <input
          [id]="'due-' + todo.id"
          type="date"
          [(ngModel)]="todo.dueDate"
          (change)="updateDueDate(todo.id, todo.dueDate || '')"
        />
      </div>

      <div class="meta">
        <span>🕒 Создана: {{ todo.createdAt || '—' }}</span>
        <span>📅 Дедлайн: {{ todo.dueDate || '—' }}</span>
      </div>
    </li>
    } }
  </ul>
  } @loading {
  <p>Загрузка...</p>
  }
</div>
